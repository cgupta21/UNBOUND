<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182426"><title>UNBOUND | Open World</title><style>/*STYLES*/</style></head>
<body><canvas id="world" aria-label="3D UNBOUND game world"></canvas><div id="shade"></div>
<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs><symbol id="sun" viewBox="0 0 60 42"><path d="M6 23a24 24 0 0 1 48 0Z M5 26h50v3H5z M9 32h42v3H9z M16 38h28v2H16z" fill="currentColor"/></symbol></defs></svg>
<header><div class="brand"><svg><use href="#sun"/></svg><span>UNBOUND</span></div><div class="topbuttons"><button id="sound" aria-label="Toggle vehicle audio" title="Toggle audio"><span class="soundbars"><i></i><i></i><i></i><i></i></span><span id="soundText">Audio ready</span></button><button class="playing" data-cmd="car">Walk / ride</button><button class="playing" data-cmd="pause" aria-label="Pause game">Ⅱ</button></div></header>
<main id="titleScreen"><div class="hero"><div class="eyebrow"><b></b> A COASTAL OPEN WORLD</div><h1 class="unbound">UNBOUND</h1><p>No Rules. No Limits. Your World.</p><div class="heroactions"><button class="major" id="skylineStart">Sunset drive</button><button class="ghost" id="walkStart">Start on foot</button><button class="ghost" id="begin">Start driving <span>▶</span></button><button class="ghost" id="hotelStart">Visit Palma Hotel</button><button id="helpTitle" class="ghost">Controls</button></div></div><div class="location"><i></i><div><small>ON LOCATION</small><strong id="titlePlace">Ocean Drive</strong></div></div></main>
<section id="hud" class="playing" aria-label="Game dashboard"><div id="status"><span id="district"></span><span id="time"></span><span id="money"></span><span id="alertState" hidden></span></div><button id="jobCard" data-cmd="jobs"><span class="eyebrow" id="jobType">JOB BOARD</span><strong id="jobTitle">Available jobs</strong><small id="jobHint"></small></button><div id="pin"></div>
<div id="mapDock"><button id="miniButton" data-cmd="map" aria-label="Open city map"><canvas id="mini" width="244" height="166"></canvas><span>M</span></button><div id="roadName">OCEAN DRIVE</div></div>
<div id="speedBox"><strong id="speed">000</strong><div><small id="unit">KM/H</small><span id="gear">P</span></div></div>
<div id="context"></div><div id="notification" role="status"></div><div class="shortcut"><span><kbd>M</kbd> Map</span><span><kbd>J</kbd> Jobs</span><span><kbd>H</kbd> Controls</span></div></section>
<div id="touch" class="playing"><div id="stick" aria-label="Movement joystick"><i></i></div><div class="touchActions"><button data-cmd="car">Board</button><button data-cmd="act">Use</button><button data-hold="brake">Sprint</button><button class="altKey" data-hold="rise">Climb</button><button class="altKey" data-hold="descend">Lower</button></div></div>
<div id="veil" hidden><section id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" tabindex="-1"><div class="panelhead"><div><div class="eyebrow" id="panelTag"></div><h2 id="panelTitle"></h2></div><button id="closePanel" aria-label="Close panel">×</button></div><div id="panelBody"></div></section></div>
<section id="arrest" hidden role="dialog" aria-label="Arrested"><div><h2>BUSTED</h2><p id="arrestInfo"></p><button class="major" id="release">Return to the street</button></div></section><div id="error" role="alert" hidden></div>
<script>/*WORLD*/</script><script>/*RENDER*/</script><script>/*APP*/</script></body></html>
